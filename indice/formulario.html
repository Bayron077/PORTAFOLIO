<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de contacto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/home/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
</head>


<body>  
    
    <header>
        <h1>Formulario de contacto</h1>
        <nav>
            <a href="/indice/indice.html">Inicio</a> |
            <a href="/indice/home.html">Acerca de Mi</a> |
        </nav>
    </header>
    <main>
        <section class="form-container">
                <form action="/" method="POST">
                    <fieldset>
                        <legend>Formulario de contacto</legend>
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" minlength="3" maxlength="10" required><br><br>

                        <label for="email">Email:  </label>
                        <input type="email" id="email" name="email" required><br><br>

                        <label for="mensaje">Mensaje:</label><br>
                        <textarea id="mensaje" name="mensaje" minlength="10" maxlength="500" required></textarea><br><br>

                        <label for="programa">Programa academico:</label>
                        <select id="programa" required>
                            <option value="">Seleccione...</option>
                            <option value="Software">Software</option>
                            <option value="Electronica">Electronica</option>
                            <option value="Industrial">Industrial</option>
                        </select><br><br>
                    </fieldset><br><br>

                    <input type="checkbox" id="terminos" name="terminos" required>
                    <label for="terminos">Acepto los términos y condiciones</label><br><br>

                    <button class="retro" type="submit" value="Enviar">Enviar</button> 
                </form>
            </section>
    </main>
    <footer>@ 2026 Derechos reservados</footer>
    
</body>
</html>
